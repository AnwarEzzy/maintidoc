name: maintidoc

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintidoc}
      POSTGRES_USER: ${POSTGRES_USER:-maintidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9

    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--pooling"
      - "cls"
      - "--dtype"
      - "float32"
      - "--port"
      - "80"
      - "--huggingface-hub-cache"
      - "/data"
      - "--max-batch-tokens"
      - "1024"
      - "--max-batch-requests"
      - "1"
      - "--max-client-batch-size"
      - "1"

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - bge_model_cache:/data

volumes:
  postgres_data:
  bge_model_cache: