[project]
name = "maintidoc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1,<2",
    "langchain-ollama>=1,<2",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-postgres>=0.9.0",
    "open-clip-torch>=4.2.2",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.50,<2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
